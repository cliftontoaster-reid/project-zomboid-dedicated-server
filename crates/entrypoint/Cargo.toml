[package]
name = "entrypoint"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "unicode"] }
rand = "0.10.3"
rcon = { version = "0.6.0", features = ["rt-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
serini = "0.3.0"
tokio = { version = "1.53.2", features = ["full"] }
