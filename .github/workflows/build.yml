name: Build and push images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: cliftontoasterreid/project-zomboid-dedicated-server
  DL_REPO: cliftontoasterreid/project-zomboid-dedicated-server-dl

jobs:
  prepare:
    name: Download game and detect version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version-stable: ${{ steps.version.outputs.stable }}
      version-unstable: ${{ steps.version.outputs.unstable }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build stable downloader
        run: docker build -f docker/app/Dockerfile --target downloader -t "$DL_REPO:stable-tmp" .

      - name: Build unstable downloader
        run: docker build -f docker/app/Dockerfile --target downloader --build-arg IS_UNSTABLE=true -t "$DL_REPO:unstable-tmp" .

      - name: Detect game versions
        id: version
        run: |
          extract_version() {
            local image=$1 dest=$2 log=$3
            local cid
            cid=$(docker create "$image")
            docker cp "$cid:/opt/zomboid" "$dest"
            docker rm "$cid" > /dev/null
            ( cd "$dest" && LD_LIBRARY_PATH="$dest/linux64:$dest" ./ProjectZomboid64 --version > "$log" 2>&1 ) || true
            grep -oE 'version=[0-9]+\.[0-9]+' "$log" | head -1 | cut -d= -f2
          }
          STABLE=$(extract_version "$DL_REPO:stable-tmp" /tmp/zstable /tmp/zstable.log) || true
          UNSTABLE=$(extract_version "$DL_REPO:unstable-tmp" /tmp/zunstable /tmp/zunstable.log) || true
          if [ -z "$STABLE" ]; then echo "ERROR: stable version detection failed. Game output:"; tail -30 /tmp/zstable.log; exit 1; fi
          if [ -z "$UNSTABLE" ]; then echo "ERROR: unstable version detection failed. Game output:"; tail -30 /tmp/zunstable.log; exit 1; fi
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "unstable=$UNSTABLE" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE unstable=$UNSTABLE"

      - name: Tag and push downloader images
        if: github.event_name != 'pull_request'
        run: |
          docker tag "$DL_REPO:stable-tmp" "$DL_REPO:${{ steps.version.outputs.stable }}"
          docker tag "$DL_REPO:unstable-tmp" "$DL_REPO:${{ steps.version.outputs.unstable }}-unstable"
          docker push "$DL_REPO:${{ steps.version.outputs.stable }}"
          docker push "$DL_REPO:${{ steps.version.outputs.unstable }}-unstable"

  build:
    name: Build ${{ matrix.os }} ${{ matrix.branch }} ${{ matrix.variant }}
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [alpine, centos, debian, rocky, ubuntu]
        branch: [stable, unstable]
        variant: [root, rootless]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images
        run: |
          DL_TAG_SUFFIX=""
          UNSTABLE_FLAG=""
          if [ "${{ matrix.branch }}" = "unstable" ]; then
            VERSION="${{ needs.prepare.outputs.version-unstable }}"
            UNSTABLE_FLAG="--unstable"
            DL_TAG_SUFFIX="-unstable"
          else
            VERSION="${{ needs.prepare.outputs.version-stable }}"
          fi
          MAJOR="${VERSION%%.*}"
          PATCH="${VERSION#*.}"
          ARGS=(--os "${{ matrix.os }}" --variant "${{ matrix.variant }}" -m "$MAJOR" -p "$PATCH")
          if [ -n "$UNSTABLE_FLAG" ]; then
            ARGS+=("$UNSTABLE_FLAG")
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            ARGS+=(--push --downloader-image "$DL_REPO:$VERSION$DL_TAG_SUFFIX")
          fi
          deno task build "${ARGS[@]}"
